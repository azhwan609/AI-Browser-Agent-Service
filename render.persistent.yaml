# Apply this Blueprint only after approving a paid Render plan.
# Render persistent disks are not available on the free plan.
services:
  - type: web
    name: ai-browser-agent-service
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /version
    disk:
      name: ai-browser-agent-identity-vault
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /ms-playwright
      - key: IDENTITY_VAULT_DIR
        value: /var/data/identity-vault
      - key: PERSISTENT_STORAGE_MOUNT
        value: /var/data
      - key: REQUIRE_PERSISTENT_STORAGE
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: IDENTITY_VAULT_KEY
        sync: false
      - key: PROFILE_ADMIN_KEY
        sync: false
