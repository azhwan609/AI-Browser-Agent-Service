    --bg:#0c0e11;
    --line:#2b3037;
    --card:#14171c;
    --chip:#191d23;
    --border:#2e343c;
    --text:#e9edf2;
    --muted:#8a929e;
    --placeholder:#6e7683;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#0c0e11 var(--tex) center/cover no-repeat fixed;
    color:var(--text);
    font-family:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  svg{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* Header */
  header{
    height:70px;flex:none;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 18px 0 22px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.01));
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 8px 24px rgba(0,0,0,.35);
    backdrop-filter:blur(10px);
  }
  .hl{display:flex;align-items:center;gap:36px}
  .icon-btn{background:none;border:0;color:#aab3c0;cursor:pointer;display:grid;place-items:center}
  .icon-btn svg{width:26px;height:26px}
  .logo{width:34px;height:38px}
  .brand{
    color:#e3e8ef;font-size:22px;letter-spacing:.04em;
    font-family:"Noto Sans","Segoe UI","DejaVu Sans","Arial Unicode MS",sans-serif;
    transform-origin:right center;
    animation:pulse 4.5s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.72;transform:scale(1);text-shadow:0 0 0 rgba(227,232,239,0)}
    50%{opacity:1;transform:scale(1.045);text-shadow:0 0 14px rgba(227,232,239,.55),0 0 28px rgba(160,180,210,.25)}
  }
  @media (prefers-reduced-motion:reduce){.brand{animation:none}}

  /* Empty chat area */
  main{flex:1;min-height:0}

  /* Composer */
  .composer-wrap{border-top:1px solid var(--line);padding:14px 10px 12px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.25))}
  .composer{
    background:
      linear-gradient(145deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,.04) 100%),
      var(--tex) center/cover no-repeat fixed;
    border:1px solid #3a414b;
    box-shadow:0 1px 0 rgba(255,255,255,.12) inset, 0 -1px 0 rgba(0,0,0,.6) inset, 0 18px 40px rgba(0,0,0,.55);
    border-radius:26px;
    padding:14px 14px 12px;
    max-width:760px;margin:0 auto;
  }
  .row{display:flex;gap:10px;align-items:center}
  .tools{overflow-x:auto;scrollbar-width:none}
  .tools::-webkit-scrollbar{display:none}

  .pill,.sq{
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.01)),var(--chip);
    box-shadow:0 1px 0 rgba(255,255,255,.08) inset;
    border:1px solid var(--border);
    color:var(--text);
    cursor:pointer;
    flex:none;
  }
  .pill{
    height:56px;border-radius:18px;padding:0 20px 0 18px;
    display:flex;align-items:center;gap:12px;font:inherit;
  }
  .pill svg{width:22px;height:22px}
  .pill b{font-weight:600;font-size:18px}
  .pill span{color:var(--muted);font-size:15px;margin-left:2px}
  .sq{width:56px;height:56px;border-radius:18px;display:grid;place-items:center}
  .sq svg{width:24px;height:24px}

  textarea{
    width:100%;border:0;outline:0;resize:none;background:transparent;
    font:inherit;font-size:21px;color:var(--text);
    padding:24px 8px 22px;min-height:84px;display:block;
  }
  textarea::placeholder{color:var(--placeholder)}

  .sel{
    height:50px;border-radius:15px;padding:0 14px;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.01)),var(--chip);box-shadow:0 1px 0 rgba(255,255,255,.08) inset;border:1px solid var(--border);color:var(--text);
    display:flex;align-items:center;gap:8px;cursor:pointer;flex:none;font:inherit;font-size:17px;
  }
  .sel svg{width:22px;height:22px}
  .sel .chev{width:15px;height:15px;stroke-width:2}
  .sel.luna{padding:0 14px 0 12px;gap:12px}
  .sel.luna span{font-size:18px}
  .sel.luna .chev{margin-left:8px}

  .bottom{display:flex;justify-content:flex-end;margin-top:12px}
  .mic{
    width:54px;height:54px;border-radius:16px;
    background:linear-gradient(145deg,#3a414c,#1b1f25 55%,#2a3038);border:1px solid #4a525e;
    box-shadow:0 1px 0 rgba(255,255,255,.18) inset, 0 6px 14px rgba(0,0,0,.45);
    display:grid;place-items:center;cursor:pointer;color:var(--text);
  }
  .mic svg{width:24px;height:24px;fill:currentColor;stroke:none}
  button:active{transform:scale(.97)}
  button:focus-visible,textarea:focus-visible{outline:2px solid #8fa4ff;outline-offset:2px}

  /* ===== Glass buttons, icy-cyan edge ===== */
  :root{--glow:125,243,255}
  .tools{padding:8px 6px;margin:-8px -6px}
  .pill,.sq,.sel,.mic{
    position:relative;isolation:isolate;
    background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04) 45%,rgba(var(--glow),.07));
    -webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);
    border:1px solid transparent;
    color:#e8fbff;
    box-shadow:
      0 1px 0 rgba(255,255,255,.35) inset,
      0 -8px 16px rgba(var(--glow),.06) inset,
      0 8px 22px rgba(0,0,0,.5),
      0 0 14px rgba(var(--glow),.12);
    transition:box-shadow .25s ease, transform .15s ease, background .25s ease;
  }
  /* gradient rim */
  .pill::before,.sq::before,.sel::before,.mic::before{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;z-index:-1;pointer-events:none;
    background:linear-gradient(135deg,rgba(var(--glow),.95),rgba(var(--glow),.12) 38%,rgba(var(--glow),.08) 62%,rgba(var(--glow),.75));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
  }
  /* glossy highlight */
  .pill::after,.sq::after,.sel::after,.mic::after{
    content:"";position:absolute;left:6%;right:6%;top:3px;height:46%;border-radius:inherit;z-index:-1;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0));
    opacity:.7;
  }
  .pill:hover,.sq:hover,.sel:hover,.mic:hover{
    box-shadow:
      0 1px 0 rgba(255,255,255,.45) inset,
      0 -8px 16px rgba(var(--glow),.12) inset,
      0 8px 22px rgba(0,0,0,.5),
      0 0 22px rgba(var(--glow),.38);
  }
  .pill:active,.sq:active,.sel:active,.mic:active{transform:scale(.96)}
  .pill svg,.sq svg,.sel svg{filter:drop-shadow(0 0 5px rgba(var(--glow),.45))}
  .pill span,.sel span{color:inherit}
  .pill span{opacity:.7}
  .mic{
    background:linear-gradient(160deg,rgba(var(--glow),.32),rgba(255,255,255,.06) 55%,rgba(var(--glow),.18));
    box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 8px 22px rgba(0,0,0,.5),0 0 22px rgba(var(--glow),.3);
  }
  .composer{border-color:rgba(var(--glow),.22)}

  /* ===== Smaller buttons, bigger glass composer ===== */
  .row{gap:8px}
  .tools{padding:8px 6px;margin:-8px -6px}
  .pill{height:44px;border-radius:14px;padding:0 15px 0 13px;gap:9px}
  .pill svg{width:19px;height:19px}
  .pill b{font-size:15px}
  .pill span{font-size:12.5px}
  .sq{width:44px;height:44px;border-radius:14px}
  .sq svg{width:20px;height:20px}
  .sel{height:40px;border-radius:13px;padding:0 11px;gap:6px;font-size:14.5px}
  .sel svg{width:19px;height:19px}
  .sel .chev{width:12px;height:12px}
  .sel.luna{padding:0 11px 0 9px;gap:9px}
  .sel.luna svg:first-child{width:25px;height:25px}
  .sel.luna span{font-size:15px}
  .mic{width:44px;height:44px;border-radius:14px}
  .mic svg{width:20px;height:20px}
  .bottom{margin-top:8px}

  .composer{
    position:relative;isolation:isolate;
    padding:18px 16px 14px;border-radius:32px;
    background:
      linear-gradient(150deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.02) 35%,rgba(var(--glow),.06) 100%),
      var(--tex) center/cover no-repeat fixed;
    -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
    border:1px solid rgba(var(--glow),.25);
    box-shadow:
      0 1.5px 0 rgba(255,255,255,.3) inset,
      0 -14px 30px rgba(var(--glow),.05) inset,
      0 22px 50px rgba(0,0,0,.6),
      0 0 24px rgba(var(--glow),.18);
    animation:framePulse 5s ease-in-out infinite;
  }
  .composer::before{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;z-index:-1;pointer-events:none;
    background:linear-gradient(140deg,rgba(var(--glow),1),rgba(var(--glow),.1) 35%,rgba(var(--glow),.05) 65%,rgba(var(--glow),.85));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    animation:rimPulse 5s ease-in-out infinite;
  }
  .composer::after{
    content:"";position:absolute;left:5%;right:5%;top:4px;height:22%;border-radius:inherit;z-index:-1;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0));
  }
  @keyframes framePulse{
    0%,100%{box-shadow:0 1.5px 0 rgba(255,255,255,.3) inset,0 -14px 30px rgba(var(--glow),.04) inset,0 22px 50px rgba(0,0,0,.6),0 0 16px rgba(var(--glow),.12)}
    50%{box-shadow:0 1.5px 0 rgba(255,255,255,.4) inset,0 -14px 30px rgba(var(--glow),.12) inset,0 22px 50px rgba(0,0,0,.6),0 0 44px rgba(var(--glow),.42)}
  }
  @keyframes rimPulse{0%,100%{opacity:.55}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.composer,.composer::before{animation:none}}

  textarea{
    min-height:170px;font-size:22px;line-height:1.5;
    padding:20px 10px 18px;color:#f1fbff;
    caret-color:rgb(var(--glow));
  }
  textarea::placeholder{color:rgba(225,240,248,.55)}

  /* ===== Top buttons float above the box, bottom buttons share one frame ===== */
  .toprow{
    display:flex;flex-wrap:wrap;gap:8px;
    max-width:760px;margin:0 auto 16px;padding:0 4px;
  }
  .dock{
    display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    padding:9px;border-radius:24px;margin-top:4px;
    background:linear-gradient(180deg,rgba(0,0,0,.38),rgba(0,0,0,.2));
    border:1px solid rgba(var(--glow),.2);

  header,.toprow,.composer-wrap{background:transparent}

  /* ===== Back to the carbon-texture background; cream-gold metallic accents ===== */
  :root{--glow:214,182,126;color-scheme:dark}
  html{background:#0c0e11 var(--tex) center/cover no-repeat fixed;min-height:100%}
  body{background:transparent;color:#f1e8d2}

  @keyframes framePulse{

  .dock{border-color:rgba(var(--glow),.22);background:transparent;box-shadow:none}

  /* ===== Send button: formal champagne-gold metal ===== */
  .send{
    position:relative;overflow:hidden;flex:none;cursor:pointer;
    height:44px;padding:0 18px 0 20px;border-radius:14px;
    display:flex;align-items:center;gap:10px;
    font:inherit;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:#2a1d0e;
    background:linear-gradient(135deg,#f5e7c2 0%,#cfae70 42%,#ecd7a4 58%,#a07d44 100%);
    border:1px solid rgba(255,236,190,.65);
    box-shadow:0 1px 0 rgba(255,255,255,.75) inset,0 -2px 4px rgba(90,60,20,.35) inset,0 8px 20px rgba(0,0,0,.55),0 0 18px rgba(var(--glow),.25);
    transition:box-shadow .25s ease,transform .15s ease,filter .25s ease;
  }
  .send svg{width:18px;height:18px;stroke-width:2.4}
  .send::after{
    content:"";position:absolute;top:0;bottom:0;left:-70%;width:40%;

  .send:hover{filter:brightness(1.06);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 -2px 4px rgba(90,60,20,.35) inset,0 8px 22px rgba(0,0,0,.55),0 0 26px rgba(var(--glow),.45)}

  /* ===== Brand text: deeper burnt brown with drop shadow ===== */
  .brand{
    color:#9a5d28;
    font-weight:700;
    animation:pulseBrown 4.5s ease-in-out infinite;
  }
  @keyframes pulseBrown{
    0%,100%{opacity:.85;transform:scale(1);text-shadow:0 2px 3px rgba(0,0,0,.9),0 4px 10px rgba(0,0,0,.6)}
    50%{opacity:1;transform:scale(1.045);text-shadow:0 3px 4px rgba(0,0,0,.95),0 6px 14px rgba(0,0,0,.65),0 0 16px rgba(154,93,40,.4)}
  }

  /* ===== Brand text: tone-on-tone with the background ===== */
  .brand{
    color:#3a3733;
    font-weight:700;
    animation:pulseTone 4.5s ease-in-out infinite;

  @keyframes pulseTone{
    0%,100%{opacity:.8;transform:scale(1);text-shadow:0 1px 0 rgba(255,255,255,.07),0 2px 3px rgba(0,0,0,.85),0 4px 8px rgba(0,0,0,.5)}
    50%{opacity:1;transform:scale(1.045);text-shadow:0 1px 0 rgba(255,255,255,.1),0 3px 4px rgba(0,0,0,.9),0 6px 12px rgba(0,0,0,.55)}
  }

  /* Send pinned to the far right of the dock */
  .dock .mic{margin-left:0}

  /* ===== Paler, softer cream tones ===== */
  :root{--glow:204,188,156}
  .logo path{fill:#e6dcc6}

  .pill,.sq,.sel{

    background:linear-gradient(160deg,rgba(240,230,205,.09),rgba(240,230,205,.02) 50%,rgba(var(--glow),.04));
    box-shadow:0 1px 0 rgba(240,230,205,.18) inset,0 6px 16px rgba(0,0,0,.5);

  .pill::before,.sq::before,.sel::before,.mic::before{
    background:linear-gradient(135deg,rgba(var(--glow),.62),rgba(var(--glow),.08) 40%,rgba(var(--glow),.05) 60%,rgba(var(--glow),.4));
  }
  .pill::after,.sq::after,.sel::after,.mic::after{opacity:.3}
  .pill:hover,.sq:hover,.sel:hover,.mic:hover{
    box-shadow:0 1px 0 rgba(240,230,205,.28) inset,0 6px 16px rgba(0,0,0,.5),0 0 12px rgba(var(--glow),.18);
  }
  .mic{
    color:#2a2418;
    background:linear-gradient(145deg,#e9dfc6,#b5a27d 55%,#d6c8a6);
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 6px 14px rgba(0,0,0,.45);
  }
  .send{
    color:#2a2418;
    background:linear-gradient(135deg,#f7eed6 0%,#d9c294 42%,#f1e4c2 58%,#b99d6d 100%);
    border-color:rgba(245,235,210,.5);
    box-shadow:0 1px 0 rgba(255,255,255,.65) inset,0 -2px 4px rgba(90,70,35,.3) inset,0 8px 20px rgba(0,0,0,.55),0 0 14px rgba(var(--glow),.16);
  }
  .send:hover{box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 -2px 4px rgba(90,70,35,.3) inset,0 8px 22px rgba(0,0,0,.55),0 0 20px rgba(var(--glow),.3)}
  .composer{border-color:rgba(var(--glow),.25)}
  @keyframes framePulse{
    0%,100%{box-shadow:0 1.5px 0 rgba(240,230,205,.18) inset,0 22px 50px rgba(0,0,0,.6),0 0 8px rgba(var(--glow),.06)}
    50%{box-shadow:0 1.5px 0 rgba(240,230,205,.24) inset,0 22px 50px rgba(0,0,0,.6),0 0 22px rgba(var(--glow),.2)}

  .dock{border-color:rgba(var(--glow),.16)}
  textarea{color:#eee6d3}

  /* ===== Chat + interactive states ===== */
  main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:14px 16px}
  .msg{max-width:min(86%,560px);padding:12px 15px;border-radius:18px;font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:#eee6d3;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .msg.user{align-self:flex-end;background:linear-gradient(160deg,rgba(255,240,205,.18),rgba(255,240,205,.06));border:1px solid rgba(var(--glow),.35)}
  .msg.assistant{align-self:flex-start;background:rgba(0,0,0,.42);border:1px solid rgba(var(--glow),.2)}
  .msg.pending{animation:msgPulse 1.4s ease-in-out infinite}
  .msg.error{border-color:rgba(229,72,77,.6)}
  @keyframes msgPulse{50%{opacity:.45}}
  .pill.on,.sq.on,.sel.on,.mic.on{
    background:linear-gradient(160deg,rgba(var(--glow),.38),rgba(var(--glow),.12));
    box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 0 16px rgba(var(--glow),.5),0 6px 16px rgba(0,0,0,.5)}
  .send:disabled{filter:grayscale(.35) brightness(.8);cursor:progress}
  .menu{position:fixed;z-index:50;min-width:150px;padding:6px;border-radius:16px;
    background:rgba(16,16,18,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border:1px solid rgba(var(--glow),.3);box-shadow:0 18px 40px rgba(0,0,0,.6)}
  .menu button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:10px;background:none;color:#eee6d3;font:inherit;font-size:14px;cursor:pointer}
  .menu button:hover,.menu button[aria-checked="true"]{background:rgba(var(--glow),.2)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px 8px}
  .chips[hidden]{display:none}
  .chip{padding:5px 10px;border-radius:999px;font-size:12px;color:#eee6d3;cursor:pointer;background:rgba(var(--glow),.16);border:1px solid rgba(var(--glow),.3)}
  /* Compact bottom composer and spacious, readable agent response cards. */
  main#chat{scroll-behavior:smooth;overscroll-behavior:contain;padding:14px clamp(12px,4vw,30px) 20px}
  .msg.user{width:fit-content;max-width:min(80%,560px);overflow-wrap:anywhere}
  .msg.assistant{position:relative;align-self:flex-start;box-sizing:border-box;width:min(100%,800px);max-width:min(100%,800px);min-width:0;padding:40px 20px 18px;border-radius:22px;border:1px solid rgba(var(--glow),.38);background:radial-gradient(ellipse at 92% 0%,rgba(var(--glow),.16),transparent 40%),linear-gradient(145deg,rgba(18,23,31,.97),rgba(8,11,17,.96));box-shadow:0 16px 42px rgba(0,0,0,.46),0 0 24px rgba(var(--glow),.09),0 1px 0 rgba(255,255,255,.1) inset;color:#f4efe3;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
  .msg.assistant::before{content:"AGENT RESPONSE";position:absolute;top:14px;left:20px;font-size:10px;font-weight:700;letter-spacing:.16em;color:rgb(var(--glow));opacity:.9}
  .msg.assistant.pending{display:flex;align-items:center;min-height:82px;animation:agentCardGlow 1.8s ease-in-out infinite}
  .msg.assistant.pending::before{content:"AGENT WORKING"}
  .msg.assistant.pending::after{content:"";position:absolute;top:15px;right:20px;width:9px;height:9px;border-radius:50%;background:rgb(var(--glow));box-shadow:0 0 14px rgba(var(--glow),.9);animation:agentDotPulse 1.1s ease-in-out infinite}
  .msg.assistant.error{border-color:rgba(229,100,92,.65);background:linear-gradient(145deg,rgba(52,23,25,.96),rgba(18,12,15,.96))}
  .msg.assistant.error::before{content:"NEEDS ATTENTION";color:#ffaaa4}
  .assistant-copy-text{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
  .assistant-footer{display:flex;align-items:center;justify-content:flex-end;gap:9px;margin-top:15px;padding-top:11px;border-top:1px solid rgba(255,255,255,.1)}
  .assistant-done{display:inline-flex;align-items:center;gap:6px;margin-right:auto;color:#82e6a4;font-size:12px;font-weight:650;letter-spacing:.02em}
  .assistant-done-mark{display:inline-grid;place-items:center;width:18px;height:18px;border:1px solid rgba(91,224,139,.55);border-radius:50%;background:rgba(42,190,101,.16);color:#72f09c;font-size:13px;line-height:1;box-shadow:0 0 12px rgba(60,218,118,.16)}
  .assistant-copy{position:relative;display:inline-grid;place-items:center;width:34px;height:32px;padding:0;border-radius:9px;border:1px solid rgba(var(--glow),.3);background:rgba(255,255,255,.055);color:#eee6d3;cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
  .assistant-copy:hover{background:rgba(var(--glow),.14);border-color:rgba(var(--glow),.62);transform:translateY(-1px)}
  .assistant-copy:focus-visible{outline:2px solid rgb(var(--glow));outline-offset:2px}
  .assistant-copy svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .assistant-copy.copied{color:#82e6a4;border-color:rgba(91,224,139,.55)}
  .assistant-copy-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
  .composer-wrap{position:sticky;bottom:0;z-index:10;flex:0 0 auto;padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(var(--glow),.22);background:linear-gradient(180deg,rgba(7,9,14,.18),rgba(7,9,14,.78))}

<script>
/* ============================ SHIWA CHAT UI — INTEGRATION GUIDE ============================
 Connect any AI model with ONE call:

   ShiwaUI.connect({
     async send(payload, ctx){
       // payload = { text, files:[File], mode:{sheetsBulk,webSearch,private},
       //             durationMin, device, agent, tool }
       // Return a string, OR call ctx.stream(chunk) repeatedly, OR return an async iterable.
       return "model reply";
     },
     onMedia(files){}, onLibrary(state){}, onVoice(text){}      // optional
   });

 Buttons (data-action): sheets | web | upload | media | library | duration | device | agent
                        | tools | mic | private | send
 Events:  ShiwaUI.on('send'|'toggle'|'select'|'upload'|'media'|'library'|'voice'|'error', fn)
 Helpers: ShiwaUI.addMessage(role,text)  ShiwaUI.setBusy(bool)  ShiwaUI.setOptions(menu,[{id,label}])
          ShiwaUI.state  (live settings)
============================================================================================== */
(function(){
  var $=function(s){return document.querySelector(s)};
  var chat=$('main'),ta=$('textarea'),chips=$('#chips'),sendBtn=$('[data-action=send]');
  var listeners={},adapter=null,menu=null,rec=null,base='';
  var state={mode:{sheetsBulk:false,webSearch:false,private:false},durationMin:15,device:'desktop',agent:'run-agent',tool:null,files:[],busy:false,listening:false};
  var options={
    duration:[{id:5,label:'5 min'},{id:15,label:'15 min'},{id:30,label:'30 min'},{id:60,label:'60 min'}],
    device:[{id:'desktop',label:'Desktop'},{id:'mobile',label:'Mobile'},{id:'cloud',label:'Cloud'}],
    agent:[{id:'run-agent',label:'Rυη αgєηт'},{id:'research',label:'Research'},{id:'browse',label:'Browse'},{id:'sheets',label:'Sheets'}],
    tools:[{id:null,label:'None'},{id:'search',label:'Search'},{id:'code',label:'Code'},{id:'files',label:'Files'},{id:'calendar',label:'Calendar'}]
  };
  var keyOf={duration:'durationMin',device:'device',agent:'agent',tools:'tool'};

  function on(e,f){(listeners[e]=listeners[e]||[]).push(f)}
  function emit(e,d){(listeners[e]||[]).forEach(function(f){try{f(d)}catch(x){console.error(x)}})}
  function addMessage(role,text){var d=document.createElement('div');d.className='msg '+role;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
  function copyResponseText(text,button,status){
    function copied(){button.classList.add('copied');button.setAttribute('aria-label','Response copied');button.title='Copied';status.textContent='Response copied to clipboard';setTimeout(function(){button.classList.remove('copied');button.setAttribute('aria-label','Copy full response');button.title='Copy full response'},1600)}
    function failed(){button.setAttribute('aria-label','Copy failed');button.title='Copy failed';status.textContent='Could not copy automatically; select the response text to copy';setTimeout(function(){button.setAttribute('aria-label','Copy full response');button.title='Copy full response'},2200)}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(copied).catch(function(){fallback()})}else fallback();
    function fallback(){var field=document.createElement('textarea');field.value=text;field.setAttribute('readonly','');field.style.position='fixed';field.style.opacity='0';field.style.pointerEvents='none';document.body.appendChild(field);field.select();try{if(document.execCommand('copy'))copied();else failed()}catch(e){failed()}field.remove()}
  }
  function finalizeAssistant(d,isError){
    if(d.dataset.finalized==='true')return;d.dataset.finalized='true';d.classList.remove('pending');if(isError)d.classList.add('error');
    var responseText=d.textContent||'';d.textContent='';
    var body=document.createElement('div');body.className='assistant-copy-text';body.textContent=responseText;d.appendChild(body);
    var footer=document.createElement('div');footer.className='assistant-footer';
    if(!isError){var done=document.createElement('span');done.className='assistant-done';done.setAttribute('aria-label','Response complete');var check=document.createElement('span');check.className='assistant-done-mark';check.setAttribute('aria-hidden','true');check.textContent='✓';var label=document.createElement('span');label.textContent='Complete';done.appendChild(check);done.appendChild(label);footer.appendChild(done)}
    var button=document.createElement('button');button.type='button';button.className='assistant-copy';button.setAttribute('aria-label','Copy full response');button.title='Copy full response';button.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h2"/></svg>';
    var status=document.createElement('span');status.className='assistant-copy-status';status.setAttribute('aria-live','polite');button.appendChild(status);button.addEventListener('click',function(){copyResponseText(responseText,button,status)});footer.appendChild(button);d.appendChild(footer);chat.scrollTop=chat.scrollHeight;
  }
  function setBusy(b){state.busy=b;sendBtn.disabled=b}
  function renderChips(){
    chips.innerHTML='';
    state.files.forEach(function(f,i){var c=document.createElement('span');c.className='chip';c.textContent=f.name+' \u00d7';c.onclick=function(){state.files.splice(i,1);renderChips()};chips.appendChild(c)});
    chips.hidden=!state.files.length}
  function pick(accept,cb){var i=document.createElement('input');i.type='file';i.multiple=true;if(accept)i.accept=accept;i.onchange=function(){cb([].slice.call(i.files))};i.click()}
  function toggle(btn,key){state.mode[key]=!state.mode[key];btn.classList.toggle('on',state.mode[key]);btn.setAttribute('aria-pressed',String(state.mode[key]));emit('toggle',{key:key,value:state.mode[key]})}
  function closeMenu(){if(menu){menu.remove();menu=null}}
  function openMenu(btn,name){
    closeMenu();
    var m=document.createElement('div');m.className='menu';m.setAttribute('role','menu');
    options[name].forEach(function(o){
      var b=document.createElement('button');b.type='button';b.textContent=o.label;
      b.setAttribute('role','menuitemradio');b.setAttribute('aria-checked',String(state[keyOf[name]]===o.id));
      b.onclick=function(){state[keyOf[name]]=o.id;var l=btn.querySelector('span');if(l&&(name==='duration'||name==='agent'))l.textContent=o.label;closeMenu();emit('select',{menu:name,value:o.id})};
      m.appendChild(b)});
    document.body.appendChild(m);
    var r=btn.getBoundingClientRect(),w=m.offsetWidth,h=m.offsetHeight,top=r.top-h-8;
    m.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';
    m.style.top=(top<8?r.bottom+8:top)+'px';menu=m}
  function mic(btn){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){emit('voice',{unsupported:true});return}
    if(state.listening&&rec){rec.stop();return}
    try{
      rec=new SR();rec.interimResults=true;rec.lang=navigator.language||'en-US';base=ta.value?ta.value+' ':'';
      rec.onresult=function(e){var t='';for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;ta.value=base+t;emit('voice',{text:t});if(adapter&&adapter.onVoice)adapter.onVoice(t)};
      rec.onend=function(){state.listening=false;btn.classList.remove('on')};
      rec.onerror=function(e){emit('error',e)};
      rec.start();state.listening=true;btn.classList.add('on');
    }catch(x){emit('error',x)}}
  async function send(){
    var text=ta.value.trim();
    if((!text&&!state.files.length)||state.busy)return;
    var payload={text:text,files:state.files.slice(),mode:Object.assign({},state.mode),durationMin:state.durationMin,device:state.device,agent:state.agent,tool:state.tool};
    addMessage('user',text||('\ud83d\udcce '+payload.files.length+' file(s)'));
    ta.value='';state.files=[];renderChips();
    emit('send',payload);setBusy(true);
    var out=addMessage('assistant','Agent is working through your request…');out.classList.add('pending');
    var ctx={message:out,stream:function(t){if(out.classList.contains('pending')){out.textContent='';out.classList.remove('pending')}out.textContent+=t;chat.scrollTop=chat.scrollHeight}};
    try{
      var res=adapter?await adapter.send(payload,ctx):'Backend not connected yet. Call ShiwaUI.connect({send}) to attach a model.';
      if(res&&typeof res[Symbol.asyncIterator]==='function'){for await(var c of res)ctx.stream(typeof c==='string'?c:(c&&c.text)||'')}
      else if(typeof res==='string'){out.classList.remove('pending');out.textContent=res}
      else if(out.classList.contains('pending')){out.classList.remove('pending');if(out.textContent==='\u2026')out.textContent=''}
      finalizeAssistant(out,false);
    }catch(e){out.textContent='Error: '+(e&&e.message||e);finalizeAssistant(out,true);emit('error',e)}
    setBusy(false);chat.scrollTop=chat.scrollHeight}

  document.addEventListener('click',function(e){
    if(menu&&!e.target.closest('.menu'))closeMenu();
    var b=e.target.closest('[data-action]');if(!b)return;
    var a=b.dataset.action;
    switch(a){
      case 'sheets':toggle(b,'sheetsBulk');break;
      case 'web':toggle(b,'webSearch');break;
      case 'private':toggle(b,'private');break;
      case 'upload':pick('',function(f){state.files=state.files.concat(f);renderChips();emit('upload',f)});break;
      case 'media':pick('image/*,video/*,audio/*',function(f){state.files=state.files.concat(f);renderChips();emit('media',f);if(adapter&&adapter.onMedia)adapter.onMedia(f)});break;
      case 'library':emit('library',state);if(adapter&&adapter.onLibrary)adapter.onLibrary(state);break;
      case 'duration':case 'device':case 'agent':case 'tools':openMenu(b,a);break;
      case 'mic':mic(b);break;
      case 'send':send();break;
    }});
  ta.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!('ontouchstart' in window)){e.preventDefault();send()}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu()});

  window.ShiwaUI={state:state,on:on,emit:emit,send:send,addMessage:addMessage,setBusy:setBusy,
    setOptions:function(n,o){options[n]=o},connect:function(a){adapter=a}};
})();
</script>

    @keyframes live-monitor-spin{to{transform:rotate(360deg)}}@keyframes live-monitor-pulse{50%{opacity:.45;box-shadow:0 0 4px rgba(214,187,132,.28)}}
    @media(max-width:600px){.live-browser-panel{right:12px;bottom:max(6px,env(safe-area-inset-bottom));width:min(300px,calc(100vw - 24px))}.live-browser-frame,.live-browser-empty{max-height:22vh;min-height:120px}}
    @media(prefers-reduced-motion:reduce){.live-browser-dot,.live-browser-spinner{animation:none}}`;
  document.head.appendChild(style);
  const panel=document.createElement('section');
  panel.className='live-browser-panel'; panel.hidden=true; panel.setAttribute('aria-label','Live Browser');
  panel.innerHTML='<div class="live-browser-head"><span class="live-browser-dot" aria-hidden="true"></span><span class="live-browser-title">Live Browser</span><span class="live-browser-badge">LIVE</span><button class="live-browser-close" type="button" aria-label="Close Live Browser">×</button></div><div class="live-browser-empty"><div class="live-browser-init"><span class="live-browser-spinner" aria-hidden="true"></span><span>Preparing browser session…</span></div></div><div class="live-browser-status" role="status" aria-live="polite">Ready</div>';
  document.body.appendChild(panel);
  const status=panel.querySelector('.live-browser-status');
  const badge=panel.querySelector('.live-browser-badge');
  panel.querySelector('.live-browser-close').addEventListener('click',()=>{panel.hidden=true});
  function showPanel(){
    panel.hidden=false;panel.classList.remove('done','failed','has-frame');badge.textContent='LIVE';
    const currentFrame=panel.querySelector('img.live-browser-frame');
    if(currentFrame){const empty=document.createElement('div');empty.className='live-browser-empty';empty.innerHTML='<div class="live-browser-init"><span class="live-browser-spinner" aria-hidden="true"></span><span>Preparing browser session…</span></div>';currentFrame.replaceWith(empty)}
    else{const empty=panel.querySelector('.live-browser-empty');if(empty)empty.innerHTML='<div class="live-browser-init"><span class="live-browser-spinner" aria-hidden="true"></span><span>Preparing browser session…</span></div>'}
    status.textContent='Connecting to the agent…';
  }
  function onEvent(name,data){
    if(name==='status') status.textContent=String(data.message||'Working…');
    else if(name==='frame'){
      if(typeof data.image!=='string'||!data.image.startsWith('data:image/jpeg;base64,'))return;
      let img=panel.querySelector('img.live-browser-frame');
      if(!img){img=document.createElement('img');img.className='live-browser-frame';img.alt='Live screenshot of the Playwright browser';panel.querySelector('.live-browser-empty')?.replaceWith(img)}
      img.onload=()=>panel.classList.add('has-frame');img.src=data.image;
    } else if(name==='complete'){window.__liveBrowserResult=data;panel.classList.add('done');badge.textContent='DONE';status.textContent='Task complete';}
    else if(name==='error'){panel.classList.add('failed');badge.textContent='ATTENTION';throw new Error(String(data.message||'The browser task failed.'));}
  }
  function parseEvent(raw){
    if(!raw||raw.startsWith(':'))return;
    let event='message',data=[];
    for(const line of raw.split(/\r?\n/)){
      if(line.startsWith('event:'))event=line.slice(6).trim();
      else if(line.startsWith('data:'))data.push(line.slice(5).trimStart());
    }
    if(!data.length)return;
    let parsed;try{parsed=JSON.parse(data.join('\n'))}catch(_){return}
    onEvent(event,parsed);
  }
  async function consume(response){
    if(!response.ok){let body={};try{body=await response.json()}catch(_){};throw new Error(body.detail||'Could not start the browser task. Please try again.')}
    if(!response.body||!response.body.getReader)throw new Error('Live streaming is not supported by this browser.');
    const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';
    while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});
      let boundary;while((boundary=buffer.search(/\r?\n\r?\n/))!==-1){const eventText=buffer.slice(0,boundary);const separator=buffer.slice(boundary).match(/^\r?\n\r?\n/)[0];buffer=buffer.slice(boundary+separator.length);parseEvent(eventText)}
    }
    buffer+=decoder.decode();if(buffer.trim())parseEvent(buffer);
  }
  window.ShiwaUI.connect({
    async send(payload){
      if(payload.files&&payload.files.length)throw new Error('File attachments are not supported by this backend yet.');
      const task=(payload.text||'').trim();if(!task)return 'Please enter a task for the agent.';
      showPanel();window.__liveBrowserResult=null;
      try{
        // This app uses same-origin HTTP streaming (SSE), not WebSockets. URL resolution
        // follows the current host and automatically uses HTTPS when the page is HTTPS.
        const endpoint=new URL('/execute/stream',window.location.href);
        let response;
        try{
          response=await fetch(endpoint.href,{method:'POST',headers:{'Content-Type':'application/json','Accept':'text/event-stream'},body:JSON.stringify({task})});
        }catch(error){
          throw new Error('Could not reach '+endpoint.origin+'/execute/stream: '+(error&&error.message||'network request failed'));
        }
        await consume(response);
        const result=window.__liveBrowserResult;
        if(!result)return 'The task finished, but no final result was received.';
        window.__liveBrowserResult=null;
        const answer=(typeof result.output==='string'?result.output:'').trim();
        if(answer)return answer;
        const pageTitle=(typeof result.page_title==='string'?result.page_title:'').trim();
        return pageTitle||'The task finished, but I couldn’t find an answer on that page.';
      }catch(error){panel.classList.add('failed');status.textContent=error.message||'Task failed';throw error}
    }
  });
})();</script>
