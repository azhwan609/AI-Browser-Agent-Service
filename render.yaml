services:
  - type: web
    name: ai-browser-agent-service
    runtime: python
    plan: free
    region: oregon
    buildCommand: "PLAYWRIGHT_BROWSERS_PATH=0 pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install --with-deps chromium"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
