services:
  - type: web
    name: ai-browser-agent-service
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /version
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /ms-playwright

      # Set these in the Render dashboard; no secret values belong in Git.
      - key: IDENTITY_VAULT_DIR
        value: /var/data/identity-vault
      - key: IDENTITY_VAULT_KEY
        sync: false
      - key: PROFILE_ADMIN_KEY
        sync: false
      - key: PERSISTENT_STORAGE_MOUNT
        value: /var/data
      - key: REQUIRE_PERSISTENT_STORAGE
        value: "true"
