services:
  - type: web
    name: ai-browser-agent-service
    runtime: python
    plan: free
    region: oregon
    buildCommand: apt-get update && apt-get install -y xvfb && PLAYWRIGHT_BROWSERS_PATH=0 pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=0 playwright install chromium
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
